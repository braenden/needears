name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Link to the page or track, if relevant.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone 16
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, audio file format and size.
