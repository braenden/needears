name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same command as `pnpm secrets:scan`, so a local run matches CI.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
