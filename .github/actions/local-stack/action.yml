name: Local stack
description: >
  Installs dependencies, starts the local Supabase stack and the local
  stand-in for the R2 audio bucket with the seed data, writes .env.local
  from them and builds the app, so a job can run `pnpm start` against a
  real database.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      with:
        version: 2.95.4
    # Only what the app talks to: Postgres, Auth, PostgREST, Storage, the API
    # gateway and Mailpit (for magic links).
    - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      shell: bash
    - run: pnpm r2:start
      shell: bash
    - name: Write .env.local from the local stack
      shell: bash
      run: |
        eval "$(supabase status -o env 2>/dev/null)"
        {
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          echo "CRON_SECRET=ci-only-not-a-secret"
          echo "R2_ENDPOINT=http://127.0.0.1:54430"
          echo "R2_ACCESS_KEY_ID=needears-local"
          echo "R2_SECRET_ACCESS_KEY=needears-local-secret"
          echo "R2_BUCKET=needears-audio"
        } > .env.local
    - run: pnpm build
      shell: bash
      env:
        NEXT_TELEMETRY_DISABLED: 1
