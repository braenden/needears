name: Local stack
description: >
  Installs dependencies, starts the local Supabase stack with the seed data,
  writes .env.local from it and builds the app, so a job can run
  `pnpm start` against a real database.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: latest
    # Only what the app talks to: Postgres, Auth, PostgREST, Storage, the API
    # gateway and Mailpit (for magic links).
    - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      shell: bash
    - name: Write .env.local from the local stack
      shell: bash
      run: |
        eval "$(supabase status -o env 2>/dev/null)"
        {
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          echo "CRON_SECRET=ci-only-not-a-secret"
        } > .env.local
    - run: pnpm build
      shell: bash
      env:
        NEXT_TELEMETRY_DISABLED: 1
